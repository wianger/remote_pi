name: mobile-dev-ios

on:
  push:
    branches: [codex/mobile-sessions-ui-20261029]
    paths: ["app/**", ".github/workflows/mobile-dev-ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-dev-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ios:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for personal signing
        run: |
          mkdir -p build/personal-ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/personal-ipa/Payload/
          cd build/personal-ipa
          zip -q -r ../RemotePi-Dev-unsigned.ipa Payload
          cd ..
          shasum -a 256 RemotePi-Dev-unsigned.ipa > RemotePi-Dev-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: RemotePi-Dev-unsigned-iOS
          path: |
            app/build/RemotePi-Dev-unsigned.ipa
            app/build/RemotePi-Dev-unsigned.ipa.sha256
          retention-days: 14
